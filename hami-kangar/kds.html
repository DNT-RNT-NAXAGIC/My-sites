<!doctype html><html lang="hy"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Համի Կանգառ — Խոհանոց</title><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Armenian:wght@400;600;700;800&display=swap" rel="stylesheet"><style>body{font-family:'Noto Sans Armenian',sans-serif;background:#171717;color:#fff}</style></head><body><header class="sticky top-0 bg-zinc-900 border-b border-zinc-700 p-4 flex items-center justify-between"><div><p class="text-xs text-amber-300">ՀԱՄԻ ԿԱՆԳԱՌ</p><h1 class="text-xl font-extrabold">Խոհանոցի վահանակ</h1></div><div id="connection" class="text-sm text-zinc-400">Միացվում է…</div></header><main class="p-4 max-w-7xl mx-auto"><div id="gate" class="hidden max-w-md mx-auto mt-14 bg-zinc-900 rounded-2xl p-6"><h2 class="font-bold text-xl">Մուտք՝ աշխատակիցների համար</h2><p class="text-zinc-400 mt-2">Մուտք գործեք այն հաշվով, որին նշանակվել է խոհանոցի, առաքիչի կամ ադմինի դեր։</p><form id="login" class="mt-4"><input required name="email" type="email" class="w-full p-3 rounded-xl text-zinc-900" placeholder="Էլ. փոստ"><button class="mt-3 w-full p-3 rounded-xl bg-amber-400 text-zinc-900 font-bold">Ուղարկել մուտքի հղում</button></form></div><div id="board" class="grid gap-4 md:grid-cols-2 xl:grid-cols-3"></div><p id="empty" class="text-center text-zinc-400 mt-16">Ակտիվ պատվերներ չկան։</p></main><div id="toast" class="hidden fixed bottom-4 left-1/2 -translate-x-1/2 bg-white text-zinc-900 p-3 rounded-xl"></div><audio id="chime" preload="auto"><source src="data:audio/wav;base64,UklGRigAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQQAAAAAAAAA" type="audio/wav"></audio><script type="module" src="./kds.js"></script></body></html>
