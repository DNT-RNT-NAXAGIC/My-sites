<!doctype html>
<html lang="hy">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#171614"><title>Ադմինիստրատորի վահանակ — Համի Կանգառ</title><script src="https://cdn.tailwindcss.com"></script><style>body{font-family:Inter,system-ui,sans-serif}button,input,select{font:inherit}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #d7b66b;outline-offset:2px}</style></head>
<body class="min-h-screen bg-[#171614] text-stone-100 px-4 py-8 sm:px-8" style="padding-bottom:env(safe-area-inset-bottom)">
  <main class="mx-auto max-w-5xl"><header class="flex flex-wrap items-center justify-between gap-3 border-b border-stone-700 pb-5"><div><p class="text-xs tracking-[.2em] text-amber-300">ՀԱՄԻ ԿԱՆԳԱՌ</p><h1 class="mt-1 text-2xl font-bold">Պատվերների կառավարում</h1></div><a href="./" class="text-sm text-stone-300 underline">Գլխավոր էջ</a></header>
    <p id="notice" role="status" aria-live="polite" class="hidden my-4 rounded-xl bg-amber-950 p-3 text-amber-100"></p>
    <section id="login-panel" class="mx-auto mt-10 max-w-md rounded-2xl border border-stone-700 bg-stone-900 p-5"><h2 class="text-lg font-semibold">Ադմինի մուտք</h2><p class="my-3 text-sm text-stone-400">Մուտքագրեք ադմինի Supabase հաշվի էլ. փոստն ու գաղտնաբառը։</p><form id="login-form" class="space-y-3"><input required type="email" autocomplete="username" name="email" placeholder="Էլ. փոստ" class="w-full rounded-xl border border-stone-600 bg-stone-800 p-3 text-base"><input required type="password" autocomplete="current-password" name="password" placeholder="Գաղտնաբառ" class="w-full rounded-xl border border-stone-600 bg-stone-800 p-3 text-base"><button class="w-full rounded-xl bg-amber-300 p-3 font-semibold text-stone-900">Մուտք</button></form></section>
    <section id="code-panel" class="hidden mx-auto mt-10 max-w-md rounded-2xl border border-stone-700 bg-stone-900 p-5"><h2 class="text-lg font-semibold">Օրվա հաստատման կոդ</h2><p class="my-3 text-sm text-stone-400">Ամեն օր նոր կոդ է ուղարկվում այս ադմինիստրատորի Supabase հաշվի էլ. փոստին։</p><button id="request-code" class="w-full rounded-xl border border-amber-300 p-3 font-semibold text-amber-200">Ուղարկել այսօրվա կոդը</button><form id="verify-form" class="mt-4 space-y-3"><label class="block text-sm">Վեցանիշ կոդ<input required inputmode="numeric" pattern="[0-9]{6}" maxlength="6" name="code" autocomplete="one-time-code" class="mt-1 w-full rounded-xl border border-stone-600 bg-stone-800 p-3 text-base"></label><button class="w-full rounded-xl bg-amber-300 p-3 font-semibold text-stone-900">Հաստատել և բացել պատվերները</button></form></section>
    <section id="orders-panel" class="hidden mt-7"><div class="mb-4 flex flex-wrap items-center justify-between gap-3"><p id="admin-email" class="text-sm text-stone-400"></p><div class="flex gap-2"><button id="refresh" class="rounded-lg border border-stone-600 px-3 py-2 text-sm">Թարմացնել</button><button id="logout" class="rounded-lg border border-stone-600 px-3 py-2 text-sm">Ելք</button></div></div><div id="orders" class="grid gap-4 md:grid-cols-2"></div></section>
  </main><script type="module" src="./admin.js"></script>
</body></html>
